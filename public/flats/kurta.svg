    <path d="M187 268 C180 334 173 412 167 489"/>
    <path d="M433 268 C440 334 447 412 453 489"/>

    <!-- ── cuff edge ─────────────────────────────────────────── -->
    <path d="M110 486 C126 490 143 492 160 491"/>
    <path d="M510 486 C494 490 477 492 460 491"/>

    <!-- ── collar band ───────────────────────────────────────── -->
    <path fill="#F2EDE4" stroke="none" d="M305 30 L315 30 L315 72 L305 72 Z"/>
    <path fill="#FFFFFF"
          d="M262 74
             C257 56 259 40 267 30
             C280 26 292 24 305 23
             L305 72 L315 72 L315 23
             C328 24 340 26 353 30
             C361 40 363 56 358 74
             Q310 88 358 74 Z"/>
    <path fill="#FFFFFF"
          d="M262 74 C257 56 259 40 267 30 C280 26 292 24 305 23 L305 72
             Q284 78 262 74 Z"/>
    <path fill="#FFFFFF"
          d="M358 74 C363 56 361 40 353 30 C340 26 328 24 315 23 L315 72

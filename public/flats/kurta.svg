             C173 412 180 334 187 268
             C179 388 166 512 158 640
             C155 692 152 742 151 793
             C232 806 388 806 469 793
             C468 742 465 692 462 640
             C454 512 441 388 433 268
             C440 334 447 412 453 489
             C454 498 457 505 464 512
             L508 509
             C514 508 516 503 515 495
             C510 380 504 232 499 118
             C498 108 496 100 492 92
             C452 84 400 77 358 74
             Q310 88 262 74 Z"/>


<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- SECONDARY FACE — Manrope (client-specified). Loaded here, not via a CSS
         @import: Tailwind v4's Vite plugin strips url() @imports at build time
         and the webfont would silently never load in production. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />

    <!-- PRIME FACE — Calone (client-supplied, self-hosted) -->
    <link rel="preload" href="/fonts/calone.otf" as="font" type="font/otf" crossorigin />

    <meta name="theme-color" content="#1A1714" />
    <meta name="description" content="Rivaayat — a couture house working with seventy-one artisan families across eight Indian states. Bridal, festive and everyday pieces, made to measure." />
    <title>Rivaayat — Couture, carried forward</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
